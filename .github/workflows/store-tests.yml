# The store's test suites on GitHub's machines instead of the laptop (owner, 2026-11-26: "increase the pace while
# maintaining quality"). The same suites, the same local database and the same no-card-keys mode as the laptop runner,
# split across machines that run at once. Nothing here deploys or touches the live database.
# The card shard runs the payment and email suites the way suites.ps1 -Mode stripe does: the Stripe stand-in
# (store/tools/fake-stripe.mjs) and the Resend stand-in (store/tools/fake-resend.mjs) with test keys only. No real keys, ever.
name: store tests
on:
  push:
    branches: [shop-quality, section-waves, pay-email-ready, "fleet/**"]   # fleet/*: agents working in parallel get the full suites here, not in the laptop's one-browser queue (owner, 2026-11-26)
    paths: ["store/**", ".github/workflows/store-tests.yml"]
  workflow_dispatch:
concurrency:
  group: store-tests-${{ github.ref }}
  cancel-in-progress: false   # a push queues behind the running check instead of cancelling it, so every commit gets a full result
jobs:
  suites:
    runs-on: ubuntu-24.04   # playwright 1.61 supports 24.04; ubuntu-latest moved to a newer release where its browsers crashed mid-suite
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: server
            suites: smoke-http test-admin test-backoffice test-ops test-orders test-quality test-checkout test-delivery test-payments test-account test-ace test-find test-seo test-emails test-golive
          - shard: card
            card: "1"
            suites: test-payments test-pay-card test-pay-card+tobacco test-emails test-checkout test-ace test-delivery test-orders e2e-buying e2e e2e-delivery e2e-flow   # the delivery and shipping walks: with card off (the buying shard) every order is a pickup, so they run here (2026-11-27)
          - shard: buying
            suites: ci-warm e2e e2e-buying e2e-delivery e2e-flow
          - shard: pages
            suites: ci-warm e2e-nav webkit-check phone-audit whitebox test-chunk test-stick
          - shard: motion
            suites: ci-warm fx-robust allwaves
    name: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # test-seo compares the share image with an earlier commit
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools (pinned to the laptop's versions)
        run: npm install --no-save --no-audit --no-fund wrangler@4.124.0 playwright@1.61.1 sharp@0.35.2
      - name: Python tools (the laptop's openpyxl)
        run: pip install openpyxl==3.1.5
      - name: Browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Catalogue seed files (generated from the master files, as on the laptop)
        run: |
          python store/tools/catalog/catalog.py seed
          python store/tools/catalog/catalog.py seed --supplier charcoal-foil --category foil
          python store/tools/catalog/catalog.py seed --supplier charcoal-foil --category charcoal
      - name: Catalogue unit tests
        if: matrix.shard == 'server'
        working-directory: store/tools/catalog
        run: python -m unittest test_catalog
      - name: Machine
        run: |
          nproc; free -m; df -h / /dev/shm
          mkdir -p store/.ci/out
          # memory and the biggest processes every 5 s, kept with the outputs, so a crash can be matched to memory
          nohup bash -c 'while true; do echo "== $(date +%T)"; free -m | sed -n 2,3p; ps -eo rss,pcpu,comm --sort=-rss | head -6; sleep 5; done' > store/.ci/out/machine.log 2>&1 &
      - name: Suites
        env:
          PW_FROM: ${{ github.workspace }}/package.json
          WRANGLER_JS: ${{ github.workspace }}/node_modules/wrangler/bin/wrangler.js
          CARD: ${{ matrix.card || '' }}   # "1" on the card shard: fake Stripe keys and the stand-in started per suite
          WAVE_SETTLE: "2500"   # software rendering on these machines: a wave gets longer to end before it counts as stuck
          DEBUG: pw:browser   # the browsers' own output goes into each suite's .txt, so a browser crash says why
          # WebKit (WPE) draws canvases with the CPU instead of through Mesa's software GL. With GL drawing, WebKit's page
          # process crashed in most WebKit suites here: "WebCore: Worker ... trap invalid opcode in libWPEWebKit" (the air's
          # OffscreenCanvas worker, fx-air-worker.js) and "WPEWebProcess segfault in libgallium" (Mesa). A/B in run 45899447119:
          # 4 of 4 WebKit suites failed with 5 kernel-logged crashes without it, 9 of 9 passed with no crash with it. Rarer crashes
          # remain (a WebCore Worker segfault during a warm-up in run 45902944851): ci-suites.mjs logs them and gives a suite one
          # more try only when its browser is proven gone. No GPU here, so both ways are software drawing.
          WEBKIT_SKIA_ENABLE_CPU_RENDERING: "1"
        run: node store/tools/ci-suites.mjs ${{ matrix.suites }}
      - name: Kernel log (out-of-memory kills, crashes)
        if: always()
        run: |
          sudo dmesg -T | tail -80 > store/.ci/out/dmesg.txt || true
          grep -iE "oom|killed process|segfault|traps:|protection fault|out of memory" store/.ci/out/dmesg.txt || echo "no oom or crash lines in the kernel log"
          free -m
          cp -r ~/.config/.wrangler/logs store/.ci/out/wrangler-logs 2>/dev/null || true   # wrangler's own log: why a store exited
      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.shard }}
          path: store/.ci/out
          retention-days: 7
